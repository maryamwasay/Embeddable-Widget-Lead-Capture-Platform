version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: flyrank_postgres

    restart: always

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flyrank_widget

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:

    build: .

    container_name: flyrank_backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:

  postgres_data: